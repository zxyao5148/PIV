scalar:
  treatment_types:
    continuous:
      s1_epochs: 200
      s2_epochs: 400
      s1_patience: 50
      s2_patience: 80
      lr: 0.0007
      encoder_hidden_dims: [256, 256]
      score_hidden_dims: [128, 128]
      treatment_hidden_dims: [128, 128]
      activation: relu
    binary:
      s1_epochs: 320
      s2_epochs: 640
      s1_patience: 90
      s2_patience: 150
      lr: 0.0004
      encoder_hidden_dims: [320, 320]
      score_hidden_dims: [192, 192]
      treatment_hidden_dims: [192, 192]
      activation: relu

vector:
  treatment_types:
    continuous:
      s1_epochs: 300
      s2_epochs: 500
      s1_patience: 80
      s2_patience: 100
      lr: 0.0007
      encoder_hidden_dims: [256, 256, 256]
      score_hidden_dims: [256, 256]
      treatment_hidden_dims: [256, 256]
      activation: relu
    binary:
      s1_epochs: 320
      s2_epochs: 520
      s1_patience: 120
      s2_patience: 180
      lr: 0.00035
      encoder_hidden_dims: [384, 384, 384]
      score_hidden_dims: [320, 320]
      treatment_hidden_dims: [320, 320]
      activation: relu
