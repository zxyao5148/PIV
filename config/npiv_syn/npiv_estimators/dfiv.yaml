scalar:
  treatment_types:
    continuous:
      npiv_restarts: 1
      npiv_normalize_wl: true
      dfiv_epochs: 300
      dfiv_feature_dim: 64
      dfiv_psi_hidden: 256
      dfiv_phi_hidden: 128
      dfiv_xi_hidden: 256
      dfiv_num_layers: 2
      dfiv_activation: relu
      dfiv_dropout: 0.0
      dfiv_lambda1: 0.005
      dfiv_lambda2: 0.005
      dfiv_lr: 0.001
      dfiv_lr_phi: 0.001
      dfiv_batch_size: 512
      dfiv_weight_decay: 0.000001
      dfiv_val_frac: 0.1
      dfiv_patience: 60
    binary:
      dfiv_epochs: 800
      dfiv_feature_dim: 32
      dfiv_psi_hidden: 128
      dfiv_phi_hidden: 64
      dfiv_xi_hidden: 128
      dfiv_num_layers: 2
      dfiv_activation: tanh
      dfiv_lambda1: 0.03
      dfiv_lambda2: 0.03
      dfiv_lr: 0.0005
      dfiv_lr_phi: 0.0001
      dfiv_batch_size: 0
      dfiv_weight_decay: 0.00005
      dfiv_val_frac: 0.1
      dfiv_patience: 60
  surfaces:
    poly:
      dfiv_epochs: 300
      dfiv_patience: 60
    tanh:
      dfiv_epochs: 260
      dfiv_patience: 60
    thresh:
      dfiv_epochs: 240
      dfiv_patience: 50
    varying_slope:
      dfiv_epochs: 300
      dfiv_patience: 60
    binary_linear:
      dfiv_epochs: 800
      dfiv_feature_dim: 64
      dfiv_lambda1: 0.02
      dfiv_lambda2: 0.02
      dfiv_lr_phi: 0.0001
      dfiv_patience: 60
    binary_threshold_modulated:
      dfiv_epochs: 1000
      dfiv_feature_dim: 64
      dfiv_lambda1: 0.02
      dfiv_lambda2: 0.02
      dfiv_lr_phi: 0.0001
      dfiv_patience: 80

